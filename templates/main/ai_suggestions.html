<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <title>Travel-project</title>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', path='css/bootstrap.min.css') }}"/>
</head>
<body>
<div class="d-flex flex-column align-items-center justify-content-center vh-100">
<h1>Ask AI</h1>
<form method="post" action="/web/projects/{{ project_id }}/ai_suggestions" style="...">
    <div>
        <label for="preferences">Preferences</label>
        <input id="preferences" type="text" name="preferences" placeholder="Input preferences...">
    </div>
    <div>
        <label for="days">Days</label>
        <input id="days" type="text" name="days" placeholder="Input days...">
    </div>
    <div class="text-center mb-3">
        <button type="submit" class="btn btn-primary fw-bold">Ask AI</button>
    </div>
</form>
{% if error %}
    <p class="text-warning">{{ error }}</p>
{% endif %}

{% if validation_error %}
    {% for error in validation_error %}
        <p class="text-warning">{{ error["msg"] }}</p>
    {% endfor %}
{% endif %}

{% if json_error %}
    <p class="text-warning">{{ json_error }}</p>
{% endif %}
</div>

</body>
</html>
