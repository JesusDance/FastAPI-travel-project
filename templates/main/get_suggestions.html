<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <title>Travel-project</title>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', path='css/bootstrap.min.css') }}"/>
</head>
<body>
<h1></h1>
<div class="container mt-5">
    <div class="table-responsive">
        <table class="table table-dark table-hover table-bordered align-middle shadow">
            <thead>Project {{ suggestions.project_name }}</thead>
                <tr>
                    <th>name</th>
                    <th>category</th>
                    <th>reason</th>
                    <th>estimated_visit_minutes</th>
                </tr>
            <tbody>
                {% for suggestion in suggestions.suggestions %}
                <tr>
                    <td>{{ suggestion.name }}</td>
                    <td>{{ suggestion.category }}</td>
                    <td>{{ suggestion.reason }}</td>
                    <td>{{ suggestion.estimated_visit_minutes }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
