<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <title>Travel-project</title>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', path='css/bootstrap.min.css') }}"/>
</head>
<body>

<div class="d-flex flex-column align-items-center justify-content-center vh-100">
    <h1>Sign Up</h1>
<form method="post" action="/web/signup" style="...">

    <div>
    <label for="name">Username</label>
    <input id="name" type="text" name="username" placeholder="Input your name...">
    </div>

    <div>
    <label for="pass">Password</label>
    <input id="pass" type="text" name="password" placeholder="Input your password...">
    </div>

    <div>
    <label for="email">Email</label>
    <input id="email" type="text" name="email" placeholder="Input your valid email...">
    </div>

    <div class="text-center mb-3">
        <button type="submit" class="btn btn-primary fw-bold">Submit</button>
    </div>
</form>
{% if detail %}
    <p class="text-success">{{ detail }}</p>
{% else %}
    <p class="text-warning">{{ error }}</p>
{% endif %}

{% if validation_error %}
    {% for error in validation_error %}
        <p class="text-warning">{{ error['msg'] }}</p>
    {% endfor %}
{% endif %}
</body>
</html>
